spring.application.name=stock-simulation
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/stock_db?useSSL=false&serverTimezone=Asia/Taipei&allowPublicKeyRetrieval=true&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=ThisIsADevelopmentSecretKeyForStockSystem1234567890
app.jwt.expiration-minutes=1440